basePath: /api/v1
definitions:
  routers.healthResponse:
    properties:
      db_version:
        example: 3.46.0
        type: string
      status:
        example: ok
        type: string
    type: object
  routers.healthUnavailableResponse:
    properties:
      status:
        example: database unavailable
        type: string
    type: object
info:
  contact: {}
  description: API backend for Atranna
  title: Atranna API
  version: "1.0"
paths:
  /health:
    get:
      description: Reports whether the API is up and the database version
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routers.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/routers.healthUnavailableResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
